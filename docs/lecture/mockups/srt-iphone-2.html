<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="tg-iphone-base.css">
</head>
<body>
<div class="iphone">
  <div class="dynamic-island"></div>
  <div class="iphone-screen">
    <div class="status-bar">
      <span class="time">15:47</span>
      <span class="icons">📶 📡 🔋</span>
    </div>
    <div class="tg-header">
      <span class="back">‹</span>
      <div class="tg-avatar">✨</div>
      <div class="tg-header-info">
        <div class="name">Nova ✨</div>
        <div class="status">online</div>
      </div>
    </div>
    <div class="tg-chat">
      <div class="date-sep"><span>March 15</span></div>
      
      <div class="bubble-row out">
        <div class="bubble out">
          오후 7시~9시 사이에 대구에서 수서로 가는 SRT 예약해줘
          <span class="ts">15:30 <span class="check">✓✓</span></span>
          <div class="clear"></div>
        </div>
      </div>
      
      <div class="bubble-row in">
        <div class="av">✨</div>
        <div class="bubble in">
          <div class="sender">Nova ✨</div>
          🔍 감시 시작합니다.<br><br>
          <b>구간:</b> 동대구 → 수서<br>
          <b>시간:</b> 19:00~21:00<br>
          <b>날짜:</b> 2026-03-15 (토)<br><br>
          빈 좌석 나오는 즉시 예약할게요.
          <span class="ts">15:30</span>
          <div class="clear"></div>
        </div>
      </div>
      
      <div class="bubble-row in">
        <div class="spacer"></div>
        <div class="bubble in">
          🎉 <b>예약 완료!</b><br><br>
          🚄 <b>SRT 372</b><br>
          📍 동대구 19:40 → 수서 21:26<br>
          💺 5호차 12A (일반실)<br>
          💰 43,500원<br><br>
          ⏰ 구매기한: 15:55까지 SRT 앱에서 결제해주세요.
          <span class="ts">15:47</span>
          <div class="clear"></div>
        </div>
      </div>
    </div>
    <div class="tg-input">
      <span class="attach">📎</span>
      <div class="field">Message</div>
      <span class="mic">🎤</span>
    </div>
    <div class="home-indicator"><div class="bar"></div></div>
  </div>
</div>
</body>
</html>
