<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { 
    font-family: 'Noto Sans KR', -apple-system, sans-serif;
    background: #0e1621;
    display: flex; justify-content: center; align-items: center; min-height: 100vh;
  }
  .tg { width: 540px; background: #0e1621; border-radius: 10px; overflow: hidden; }
  .tg-header {
    background: #17212b; padding: 8px 16px; display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid #101921;
  }
  .tg-header .back { color: #5ebbf4; font-size: 20px; }
  .tg-avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: linear-gradient(135deg, #8b5cf6, #a78bfa);
    display: flex; align-items: center; justify-content: center; font-size: 16px; color: #fff;
  }
  .tg-header-info .name { color: #fff; font-size: 14px; font-weight: 500; }
  .tg-header-info .status { color: #5ebbf4; font-size: 12px; }
  .tg-chat { padding: 8px 12px; display: flex; flex-direction: column; gap: 4px; }
  .date-sep { text-align: center; padding: 6px 0; }
  .date-sep span { background: #182533; color: #7e9cb5; font-size: 12px; padding: 3px 10px; border-radius: 10px; }
  .bubble-row { display: flex; align-items: flex-end; gap: 6px; margin: 1px 0; }
  .bubble-row.out { justify-content: flex-end; }
  .bubble-row.in { justify-content: flex-start; }
  .bubble-row.in .av {
    width: 32px; height: 32px; border-radius: 50%;
    background: linear-gradient(135deg, #8b5cf6, #a78bfa);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: #fff; flex-shrink: 0; margin-bottom: 2px;
  }
  .bubble { max-width: 380px; padding: 6px 10px; font-size: 13.5px; line-height: 1.55; color: #f5f5f5; }
  .bubble.out { background: #2b5278; border-radius: 10px 10px 4px 10px; }
  .bubble.in { background: #182533; border-radius: 10px 10px 10px 4px; }
  .bubble .sender { font-size: 12.5px; font-weight: 600; color: #8b5cf6; margin-bottom: 2px; }
  .bubble .ts { font-size: 11px; color: rgba(255,255,255,0.35); float: right; margin-left: 8px; margin-top: 4px; line-height: 1; }
  .bubble .ts .check { color: #5ebbf4; font-size: 12px; margin-left: 2px; }
  .spacer { width: 32px; flex-shrink: 0; }
  b { font-weight: 600; }
  .clear { clear: both; }
  .success-card {
    background: #0d2818; border: 1px solid #1a5c30; border-radius: 8px;
    padding: 10px 12px; margin-top: 5px;
  }
  .success-card .title { color: #34d058; font-weight: 700; font-size: 14px; margin-bottom: 6px; }
  .success-card .detail { color: #c5d8d1; font-size: 13px; line-height: 1.7; }
  .success-card .warn { color: #f0ad4e; font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>
<div class="tg">
  <div class="tg-header">
    <span class="back">‹</span>
    <div class="tg-avatar">✨</div>
    <div class="tg-header-info">
      <div class="name">Nova ✨</div>
      <div class="status">online</div>
    </div>
  </div>
  <div class="tg-chat">
    <div class="date-sep"><span>March 15</span></div>
    
    <div class="bubble-row out">
      <div class="bubble out">
        오후 7시~9시 사이에 대구에서 수서로 가는 SRT 예약해줘
        <span class="ts">15:30 <span class="check">✓✓</span></span>
        <div class="clear"></div>
      </div>
    </div>
    
    <div class="bubble-row in">
      <div class="av">✨</div>
      <div class="bubble in">
        <div class="sender">Nova ✨</div>
        🔍 감시 시작합니다.<br><br>
        <b>구간:</b> 동대구 → 수서<br>
        <b>시간:</b> 19:00~21:00<br>
        <b>날짜:</b> 2026-03-15 (토)<br><br>
        빈 좌석 나오는 즉시 예약할게요.
        <span class="ts">15:30</span>
        <div class="clear"></div>
      </div>
    </div>
    
    <div class="bubble-row in">
      <div class="spacer"></div>
      <div class="bubble in">
        <div class="success-card">
          <div class="title">🎉 예약 완료!</div>
          <div class="detail">
            <b>열차:</b> SRT 372<br>
            <b>출발:</b> 동대구 19:40<br>
            <b>도착:</b> 수서 21:26<br>
            <b>좌석:</b> 5호차 12A (일반실)<br>
            <b>요금:</b> 43,500원
          </div>
          <div class="warn">⏰ 구매기한: 15:55까지 SRT 앱에서 결제</div>
        </div>
        <span class="ts">15:47</span>
        <div class="clear"></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
